# Supabase CLI configuration for the local development stack (`supabase start`).
# Production settings are configured in the Supabase dashboard — see
# docs/DEPLOYMENT_AND_SECURITY.md §4. Keep both in line.
project_id = "mini-project-tracker"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
# Reference data only; never real people.
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Accounts are created by HOD invitation only.
enable_signup = false
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.email]
enable_confirmations = true
secure_password_change = true
