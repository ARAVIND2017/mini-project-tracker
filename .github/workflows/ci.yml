name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build # includes the bundle secret scan (SEC-11)
      - run: pnpm audit --prod --audit-level high

  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The runner image ships PostgreSQL; db-test.sh starts a throwaway cluster.
      - run: bash scripts/db-test.sh
